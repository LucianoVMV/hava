<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la app ocupa toda la pantalla del iPhone (incluido el notch);
       luego en CSS usamos env(safe-area-inset-*) para que nada quede tapado. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini Apps</title>
  <meta name="description" content="Mis mini apps personales: productividad, agenda y finanzas.">

  <!-- Color de la barra del navegador, según modo claro/oscuro -->
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- PWA: manifest para Android/PC y meta tags específicos de iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Apps">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="barra-superior">
    <a id="btn-atras" class="btn-atras" href="#/mas" hidden aria-label="Volver">‹</a>
    <h1 id="titulo-vista">Hoy</h1>
  </header>

  <!-- Aquí app.js dibuja la pantalla actual -->
  <main id="vista" class="vista" tabindex="-1"></main>

  <!-- Barra de pestañas inferior (estilo iPhone) -->
  <nav class="barra-pestanas" aria-label="Secciones">
    <a href="#/hoy" data-pestana="hoy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Hoy</span>
    </a>
    <a href="#/habitos" data-pestana="habitos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>
      <span>Hábitos</span>
    </a>
    <a href="#/enfoque" data-pestana="enfoque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span>Enfoque</span>
    </a>
    <a href="#/mas" data-pestana="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span>Más</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
